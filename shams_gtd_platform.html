<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHAMS GTD — Personal Productivity Platform</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            shams: {
              50: '#fffbf0',
              100: '#fef3c7',
              400: '#f59e0b',
              500: '#d97706',
              600: '#b45309',
              gold: '#e5b84b',
              goldHover: '#d4a333',
              navy: '#0b1320',
              navyCard: '#131e30',
              navyBorder: '#202e46',
              navyHover: '#1c2a42'
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.3);
      border-radius: 9999px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
    }
    
    /* Subtle animations */
    .fade-in {
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-shams-navy dark:text-gray-100 min-h-screen font-sans antialiased selection:bg-shams-gold selection:text-shams-navy transition-colors duration-200">

  <!-- APP CONTAINER -->
  <div class="flex h-screen overflow-hidden">

    <!-- MOBILE OVERLAY BACKDROP -->
    <div id="mobileBackdrop" class="fixed inset-0 bg-black/60 z-40 lg:hidden hidden backdrop-blur-sm transition-opacity"></div>

    <!-- SIDEBAR NAVIGATION -->
    <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 z-50 w-72 bg-white dark:bg-shams-navy flex flex-col border-r border-gray-200 dark:border-shams-navyBorder transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out">
      
      <!-- BRAND HEADER -->
      <div class="px-6 py-6 flex items-center justify-between border-b border-gray-100 dark:border-shams-navyBorder/50">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="switchView('home')">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-shams-gold to-amber-300 flex items-center justify-center text-shams-navy shadow-lg shadow-shams-gold/20 font-bold text-xl">
            ☼
          </div>
          <div>
            <div class="flex items-center space-x-1.5">
              <span class="font-extrabold text-lg tracking-wider text-gray-900 dark:text-white">SHAMS</span>
              <span class="bg-shams-gold/20 text-shams-gold font-bold text-[10px] px-1.5 py-0.5 rounded tracking-widest uppercase">GTD</span>
            </div>
            <p class="text-[10px] tracking-widest text-gray-400 font-semibold">ENTERPRISE WEB</p>
          </div>
        </div>
        <button id="closeMobileSidebar" class="lg:hidden text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-white p-2">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <!-- GTD NAVIGATION LIST -->
      <div class="flex-1 overflow-y-auto px-4 py-5 space-y-7">
        
        <!-- MAIN WORKSPACE -->
        <div>
          <div class="px-3 mb-2 text-[10px] font-bold tracking-widest text-gray-400 uppercase" data-i18n="workspace">WORKSPACE</div>
          <nav class="space-y-1">
            <button onclick="switchView('home')" id="nav-home" class="nav-btn w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl font-medium text-sm transition-all duration-150 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-shams-navyHover">
              <div class="flex items-center space-x-3">
                <i class="fa-solid fa-house w-5 text-center text-gray-400 dark:text-gray-400"></i>
                <span data-i18n="overview">Overview</span>
              </div>
            </button>

            <button onclick="switchView('inbox')" id="nav-inbox" class="nav-btn w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl font-medium text-sm transition-all duration-150 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-shams-navyHover">
              <div class="flex items-center space-x-3">
                <i class="fa-solid fa-inbox w-5 text-center text-amber-500"></i>
                <span data-i18n="inbox">Inbox</span>
              </div>
              <span id="badge-inbox" class="text-xs font-semibold px-2 py-0.5 rounded-full bg-amber-100 text-amber-700 dark:bg-amber-500/20 dark:text-amber-300">0</span>
            </button>

            <button onclick="switchView('next')" id="nav-next" class="nav-btn w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl font-medium text-sm transition-all duration-150 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-shams-navyHover">
              <div class="flex items-center space-x-3">
                <i class="fa-solid fa-bolt w-5 text-center text-blue-500"></i>
                <span data-i18n="nextActions">Next actions</span>
              </div>
              <span id="badge-next" class="text-xs font-semibold px-2 py-0.5 rounded-full bg-gray-100 text-gray-600 dark:bg-shams-navyBorder dark:text-gray-300">0</span>
            </button>

            <button onclick="switchView('projects')" id="nav-projects" class="nav-btn w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl font-medium text-sm transition-all duration-150 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-shams-navyHover">
              <div class="flex items-center space-x-3">
                <i class="fa-solid fa-diagram-project w-5 text-center text-purple-500"></i>
                <span data-i18n="projects">Projects</span>
              </div>
              <span id="badge-projects" class="text-xs font-semibold px-2 py-0.5 rounded-full bg-gray-100 text-gray-600 dark:bg-shams-navyBorder dark:text-gray-300">0</span>
            </button>
          </nav>
        </div>

        <!-- GTD ORGANIZING CATEGORIES -->
        <div>
          <div class="px-3 mb-2 text-[10px] font-bold tracking-widest text-gray-400 uppercase" data-i18n="organization">ORGANIZATION</div>
          <nav class="space-y-1">
            <button onclick="switchView('waiting')" id="nav-waiting" class="nav-btn w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl font-medium text-sm transition-all duration-150 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-shams-navyHover">
              <div class="flex items-center space-x-3">
                <i class="fa-solid fa-hourglass-half w-5 text-center text-orange-400"></i>
                <span data-i18n="waiting">Waiting for</span>
              </div>
              <span id="badge-waiting" class="text-xs font-semibold px-2 py-0.5 rounded-full bg-gray-100 text-gray-600 dark:bg-shams-navyBorder dark:text-gray-300">0</span>
            </button>

            <button onclick="switchView('someday')" id="nav-someday" class="nav-btn w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl font-medium text-sm transition-all duration-150 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-shams-navyHover">
              <div class="flex items-center space-x-3">
                <i class="fa-solid fa-cloud-moon w-5 text-center text-indigo-400"></i>
                <span data-i18n="someday">Someday / Maybe</span>
              </div>
              <span id="badge-someday" class="text-xs font-semibold px-2 py-0.5 rounded-full bg-gray-100 text-gray-600 dark:bg-shams-navyBorder dark:text-gray-300">0</span>
            </button>

            <button onclick="switchView('done')" id="nav-done" class="nav-btn w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl font-medium text-sm transition-all duration-150 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-shams-navyHover">
              <div class="flex items-center space-x-3">
                <i class="fa-solid fa-circle-check w-5 text-center text-emerald-500"></i>
                <span data-i18n="completed">Completed</span>
              </div>
              <span id="badge-done" class="text-xs font-semibold px-2 py-0.5 rounded-full bg-gray-100 text-gray-600 dark:bg-shams-navyBorder dark:text-gray-300">0</span>
            </button>
          </nav>
        </div>

      </div>

      <!-- SIDEBAR FOOTER & THEME TOGGLE -->
      <div class="p-4 border-t border-gray-100 dark:border-shams-navyBorder/50 space-y-3">
        <button id="themeToggle" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-medium border border-gray-200 dark:border-shams-navyBorder text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-shams-navyHover transition-colors">
          <div class="flex items-center space-x-3">
            <i id="themeIcon" class="fa-solid fa-moon text-shams-gold"></i>
            <span data-i18n="toggleTheme">Toggle theme</span>
          </div>
          <span id="themeText" class="text-xs text-gray-400 uppercase font-semibold">Dark</span>
        </button>
        <div class="text-center pt-1">
          <p class="text-[10px] font-bold tracking-widest text-gray-400 uppercase">CLARITY · FOCUS · ACTION</p>
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT CONTAINER -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden">

      <!-- TOP HEADER BAR -->
      <header class="h-20 bg-white/80 dark:bg-shams-navy/80 backdrop-blur-md border-b border-gray-200 dark:border-shams-navyBorder px-4 sm:px-8 flex items-center justify-between shrink-0 z-10">
        
        <div class="flex items-center space-x-4">
          <button id="openMobileSidebar" class="lg:hidden p-2 rounded-xl border border-gray-200 dark:border-shams-navyBorder text-gray-600 dark:text-gray-300">
            <i class="fa-solid fa-bars text-lg"></i>
          </button>
          <div>
            <div class="text-[10px] font-bold tracking-widest text-shams-gold uppercase" data-i18n="personalWorkspace">YOUR PERSONAL WORKSPACE</div>
            <h1 id="pageTitle" class="text-xl sm:text-2xl font-bold text-gray-900 dark:text-white tracking-tight">Overview</h1>
          </div>
        </div>

        <div class="flex items-center space-x-3 sm:space-x-4">
          <!-- LANGUAGE SELECTOR -->
          <div class="relative">
            <select id="languageSelect" class="appearance-none bg-gray-100 dark:bg-shams-navyCard border border-gray-200 dark:border-shams-navyBorder text-xs sm:text-sm font-semibold rounded-xl px-3 sm:px-4 py-2 sm:py-2.5 pr-8 text-gray-700 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-shams-gold cursor-pointer">
              <option value="en">🇺🇸 English</option>
              <option value="ru">🇷🇺 Русский</option>
              <option value="uz">🇺🇿 O‘zbekcha</option>
            </select>
            <i class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-xs text-gray-400 pointer-events-none"></i>
          </div>

          <!-- NEW TASK BUTTON -->
          <button onclick="openTaskModal()" class="bg-shams-gold hover:bg-shams-goldHover text-shams-navy font-bold px-4 py-2.5 rounded-xl shadow-lg shadow-shams-gold/20 flex items-center space-x-2 text-sm transition-transform active:scale-95">
            <i class="fa-solid fa-plus"></i>
            <span class="hidden sm:inline" data-i18n="newTask">New task</span>
          </button>
        </div>
      </header>

      <!-- DYNAMIC VIEW PORT -->
      <main id="mainView" class="flex-1 overflow-y-auto p-4 sm:p-8">
        <!-- Rendered dynamically -->
      </main>

      <!-- FOOTER -->
      <footer class="h-10 border-t border-gray-200 dark:border-shams-navyBorder/40 px-8 flex items-center justify-between text-xs text-gray-400 bg-white/50 dark:bg-shams-navy/50 shrink-0">
        <div>SHAMS GTD Platform &copy; 2026</div>
        <div data-i18n="tagline">Take control of your day.</div>
      </footer>
    </div>
  </div>

  <!-- CREATE / EDIT TASK MODAL -->
  <div id="taskModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm hidden fade-in">
    <div class="bg-white dark:bg-shams-navyCard border border-gray-200 dark:border-shams-navyBorder rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden">
      
      <div class="px-6 py-5 border-b border-gray-100 dark:border-shams-navyBorder flex items-center justify-between">
        <h3 class="text-lg font-bold text-gray-900 dark:text-white" data-i18n="captureTask">Capture a task</h3>
        <button onclick="closeTaskModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-white p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <form id="taskForm" onsubmit="handleTaskSubmit(event)" class="p-6 space-y-4">
        
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1.5" data-i18n="whatToDo">What needs to be done?</label>
          <input type="text" id="taskTitleInput" required maxlength="120" placeholder="e.g. Prepare project presentation" 
            class="w-full bg-gray-50 dark:bg-shams-navy border border-gray-200 dark:border-shams-navyBorder rounded-xl px-4 py-3 text-sm text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-shams-gold">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1.5" data-i18n="list">List Category</label>
            <select id="taskListInput" class="w-full bg-gray-50 dark:bg-shams-navy border border-gray-200 dark:border-shams-navyBorder rounded-xl px-4 py-3 text-sm text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-shams-gold">
              <option value="inbox" data-i18n="inbox">Inbox</option>
              <option value="next" data-i18n="nextAction">Next Action</option>
              <option value="waiting" data-i18n="waiting">Waiting for</option>
              <option value="someday" data-i18n="someday">Someday / Maybe</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1.5" data-i18n="priority">Priority</label>
            <select id="taskPriorityInput" class="w-full bg-gray-50 dark:bg-shams-navy border border-gray-200 dark:border-shams-navyBorder rounded-xl px-4 py-3 text-sm text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-shams-gold">
              <option value="normal" data-i18n="normal">Normal</option>
              <option value="high" data-i18n="high">High</option>
              <option value="low" data-i18n="low">Low</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1.5" data-i18n="dueDate">Due Date</label>
            <input type="date" id="taskDateInput" class="w-full bg-gray-50 dark:bg-shams-navy border border-gray-200 dark:border-shams-navyBorder rounded-xl px-4 py-3 text-sm text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-shams-gold">
          </div>

          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1.5" data-i18n="projectOptional">Project (optional)</label>
            <input type="text" id="taskProjectInput" placeholder="e.g. Mobile App" class="w-full bg-gray-50 dark:bg-shams-navy border border-gray-200 dark:border-shams-navyBorder rounded-xl px-4 py-3 text-sm text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-shams-gold">
          </div>
        </div>

        <div class="pt-2 flex justify-end space-x-3">
          <button type="button" onclick="closeTaskModal()" class="px-5 py-2.5 rounded-xl border border-gray-200 dark:border-shams-navyBorder text-sm font-semibold text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-shams-navyHover" data-i18n="cancel">Cancel</button>
          <button type="submit" class="bg-shams-gold hover:bg-shams-goldHover text-shams-navy font-bold px-6 py-2.5 rounded-xl shadow-md text-sm" data-i18n="saveTask">Save Task</button>
        </div>

      </form>
    </div>
  </div>

          next: "Keyingi harakat",
          waiting: "Kutilmoqda",
          someday: "Balki / Keyinroq",
          done: "Bajarilgan"
        }
      }
    };

    // --- INITIAL SEED DATA ---
    const initialTasks = [
      { id: '1', title: 'Review GTD weekly commitments and clarify inbox', list: 'next', priority: 'high', date: '2026-11-06', project: 'GTD Platform' },
      { id: '2', title: 'Collect design tokens & user feedback for v1.2', list: 'inbox', priority: 'normal', date: '', project: 'UI Upgrade' },
      { id: '3', title: 'Wait for architecture approval from lead developer', list: 'waiting', priority: 'low', date: '2026-11-10', project: 'GTD Platform' },
      { id: '4', title: 'Explore WebAssembly SQLite synchronization', list: 'someday', priority: 'low', date: '', project: 'Research' },
      { id: '5', title: 'Initial setup of SHAMS GTD Web Interface', list: 'done', priority: 'high', date: '2026-11-05', project: 'GTD Platform' }
    ];

    const initialProjects = ['GTD Platform', 'UI Upgrade', 'Research'];

    // --- APPLICATION STATE ---
    let state = {
      tasks: JSON.parse(localStorage.getItem('shams_tasks')) || initialTasks,
      projects: JSON.parse(localStorage.getItem('shams_projects')) || initialProjects,
      currentView: 'home',
      lang: localStorage.getItem('shams_lang') || 'en',
      theme: localStorage.getItem('shams_theme') || 'dark',
      searchQuery: ''
    };

    // --- HELPER FUNCTIONS ---
    function t(key) {
      return i18n[state.lang][key] || i18n.en[key] || key;
    }

    function saveState() {
      localStorage.setItem('shams_tasks', JSON.stringify(state.tasks));
      localStorage.setItem('shams_projects', JSON.stringify(state.projects));
      localStorage.setItem('shams_lang', state.lang);
      localStorage.setItem('shams_theme', state.theme);
      updateBadges();
    }

    function applyTheme() {
      if (state.theme === 'dark') {
        document.documentElement.classList.add('dark');
        document.getElementById('themeIcon').className = 'fa-solid fa-moon text-shams-gold';
        document.getElementById('themeText').textContent = 'Dark';
      } else {
        document.documentElement.classList.remove('dark');
        document.getElementById('themeIcon').className = 'fa-solid fa-sun text-amber-500';
        document.getElementById('themeText').textContent = 'Light';
      }
    }

    function applyLanguage() {
      document.getElementById('languageSelect').value = state.lang;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (i18n[state.lang][key]) {
          el.textContent = i18n[state.lang][key];
        }
      });
      render();
    }

    function updateBadges() {
      const counts = {
        inbox: state.tasks.filter(t => t.list === 'inbox').length,
        next: state.tasks.filter(t => t.list === 'next').length,
        projects: state.projects.length,
        waiting: state.tasks.filter(t => t.list === 'waiting').length,
        someday: state.tasks.filter(t => t.list === 'someday').length,
        done: state.tasks.filter(t => t.list === 'done').length
      };

      for (const [key, val] of Object.entries(counts)) {
        const badge = document.getElementById(`badge-${key}`);
        if (badge) badge.textContent = val;
      }
    }

    // --- UI NAVIGATION & VIEWS ---
    function switchView(viewName) {
      state.currentView = viewName;
      state.searchQuery = '';
      
      const viewTitles = {
        home: t('overview'),
        inbox: t('inbox'),
        next: t('nextActions'),
        projects: t('projects'),
        waiting: t('waiting'),
        someday: t('someday'),
        done: t('completed')
      };

      document.getElementById('pageTitle').textContent = viewTitles[viewName] || t('overview');

      // Highlight Sidebar Navigation
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('bg-shams-gold/15', 'text-shams-gold', 'dark:text-shams-gold', 'font-bold');
      });
      const activeNav = document.getElementById(`nav-${viewName}`);
      if (activeNav) {
        activeNav.classList.add('bg-shams-gold/15', 'text-shams-gold', 'dark:text-shams-gold', 'font-bold');
      }

      // Close mobile drawer if open
      closeMobileMenu();

      render();
    }

    // --- TASK RENDERING ENGINE ---
    function renderTaskCard(task) {
      const isDone = task.list === 'done';
      
      const priorityColors = {
        high: 'bg-red-500/10 text-red-500 border-red-500/20',
        normal: 'bg-blue-500/10 text-blue-500 border-blue-500/20',
        low: 'bg-gray-500/10 text-gray-400 border-gray-500/20'
      };

      return `
        <div class="group bg-white dark:bg-shams-navyCard border border-gray-200 dark:border-shams-navyBorder rounded-2xl p-4 flex items-center justify-between gap-4 hover:border-shams-gold/40 transition-all duration-150">
          <div class="flex items-center space-x-4 flex-1 min-w-0">
            <input type="checkbox" ${isDone ? 'checked' : ''} onchange="toggleTaskDone('${task.id}')"
              class="w-5 h-5 rounded-md text-shams-gold focus:ring-shams-gold accent-shams-gold cursor-pointer">
            <div class="flex-1 min-w-0">
              <div class="text-sm font-semibold ${isDone ? 'line-through text-gray-400 dark:text-gray-500' : 'text-gray-900 dark:text-white'} truncate">
                ${escapeHtml(task.title)}
              </div>
              <div class="flex flex-wrap items-center gap-2 mt-1 text-xs text-gray-400">
                ${task.project ? `<span class="bg-gray-100 dark:bg-shams-navy text-gray-600 dark:text-gray-300 px-2 py-0.5 rounded-md border border-gray-200 dark:border-shams-navyBorder font-medium"><i class="fa-solid fa-folder text-[10px] mr-1"></i>${escapeHtml(task.project)}</span>` : ''}
                <span><i class="fa-regular fa-calendar text-[10px] mr-1"></i>${task.date ? task.date : t('noDueDate')}</span>
                <span class="px-2 py-0.5 rounded-md border text-[10px] font-bold uppercase tracking-wider ${priorityColors[task.priority] || priorityColors.normal}">
                  ${t(task.priority)}
                </span>
              </div>
            </div>
          </div>
          <div class="flex items-center space-x-2">
            <span class="hidden sm:inline-block text-xs font-semibold px-2.5 py-1 rounded-lg bg-gray-100 dark:bg-shams-navy text-gray-500 dark:text-gray-400 border border-gray-200 dark:border-shams-navyBorder">
              ${t('listNames')[task.list] || task.list}
            </span>
            <button onclick="deleteTask('${task.id}')" class="opacity-0 group-hover:opacity-100 p-2 text-gray-400 hover:text-red-500 transition-opacity">
              <i class="fa-solid fa-trash-can text-sm"></i>
            </button>
          </div>
        </div>
      `;
    }

    // --- MAIN RENDER ROUTINE ---
    function render() {
      const main = document.getElementById('mainView');
      const view = state.currentView;

      if (view === 'home') {
        const activeTasks = state.tasks.filter(t => t.list !== 'done');
        const inboxTasks = state.tasks.filter(t => t.list === 'inbox');
        const nextTasks = state.tasks.filter(t => t.list === 'next');
        const doneTasks = state.tasks.filter(t => t.list === 'done');

        main.innerHTML = `
          <div class="max-w-6xl mx-auto space-y-6 fade-in">
            <!-- WELCOME BANNER -->
            <div class="bg-gradient-to-r from-shams-navyCard to-slate-900 border border-shams-navyBorder p-6 sm:p-8 rounded-3xl shadow-xl text-white relative overflow-hidden">
              <div class="absolute -right-6 -bottom-6 w-48 h-48 bg-shams-gold/10 rounded-full blur-3xl pointer-events-none"></div>
              <div class="text-xs font-bold tracking-widest text-shams-gold uppercase mb-2">CLARITY · FOCUS · ACTION</div>
              <h2 class="text-2xl sm:text-3xl font-extrabold tracking-tight mb-2">${t('welcome')}</h2>
              <p class="text-gray-300 text-sm max-w-xl">${t('intro')}</p>
            </div>

            <!-- DASHBOARD METRICS -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
              <div class="bg-white dark:bg-shams-navyCard border border-gray-200 dark:border-shams-navyBorder p-5 rounded-2xl">
                <div class="text-xs font-bold text-gray-400 uppercase tracking-wider">${t('openTasks')}</div>
                <div class="text-3xl font-extrabold text-gray-900 dark:text-white mt-2">${activeTasks.length}</div>
              </div>
              <div class="bg-white dark:bg-shams-navyCard border border-gray-200 dark:border-shams-navyBorder p-5 rounded-2xl">
                <div class="text-xs font-bold text-amber-500 uppercase tracking-wider">${t('inboxCount')}</div>
                <div class="text-3xl font-extrabold text-gray-900 dark:text-white mt-2">${inboxTasks.length}</div>
              </div>
              <div class="bg-white dark:bg-shams-navyCard border border-gray-200 dark:border-shams-navyBorder p-5 rounded-2xl">
                <div class="text-xs font-bold text-blue-500 uppercase tracking-wider">${t('nextActions')}</div>
                <div class="text-3xl font-extrabold text-gray-900 dark:text-white mt-2">${nextTasks.length}</div>
              </div>
              <div class="bg-white dark:bg-shams-navyCard border border-gray-200 dark:border-shams-navyBorder p-5 rounded-2xl">
                <div class="text-xs font-bold text-emerald-500 uppercase tracking-wider">${t('completedCount')}</div>
                <div class="text-3xl font-extrabold text-gray-900 dark:text-white mt-2">${doneTasks.length}</div>
              </div>
            </div>

            <!-- NEXT ACTIONS QUICK PANEL -->
            <div class="bg-white dark:bg-shams-navyCard border border-gray-200 dark:border-shams-navyBorder rounded-3xl p-6">
              <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold text-gray-900 dark:text-white flex items-center gap-2">
                  <i class="fa-solid fa-bolt text-blue-500"></i> ${t('nextActions')}
                </h3>
                <span class="text-xs font-semibold text-gray-400">${t('focus')}</span>
              </div>
              <div class="space-y-3">
                ${nextTasks.length > 0 
                  ? nextTasks.slice(0, 5).map(renderTaskCard).join('') 
                  : `<div class="text-center py-8 text-gray-400 text-sm">${t('empty')}</div>`}
              </div>
            </div>
          </div>
        `;
      } else if (view === 'projects') {
        main.innerHTML = `
          <div class="max-w-6xl mx-auto space-y-6 fade-in">
            <!-- CREATE NEW PROJECT BAR -->
            <div class="bg-white dark:bg-shams-navyCard border border-gray-200 dark:border-shams-navyBorder p-4 rounded-2xl flex flex-col sm:flex-row gap-3">
              <input type="text" id="newProjectInput" placeholder="${t('newProject')}" 
                class="flex-1 bg-gray-50 dark:bg-shams-navy border border-gray-200 dark:border-shams-navyBorder rounded-xl px-4 py-2.5 text-sm text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-shams-gold">
              <button onclick="addProject()" class="bg-shams-gold hover:bg-shams-goldHover text-shams-navy font-bold px-5 py-2.5 rounded-xl text-sm transition-transform active:scale-95 shrink-0">
                ＋ ${t('addProject')}
              </button>
            </div>

            <!-- PROJECTS GRID -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${state.projects.length > 0 ? state.projects.map(proj => {
                const total = state.tasks.filter(t => t.project === proj).length;
                const completed = state.tasks.filter(t => t.project === proj && t.list === 'done').length;
                const pct = total > 0 ? Math.round((completed / total) * 100) : 0;

                return `
                  <div class="bg-white dark:bg-shams-navyCard border border-gray-200 dark:border-shams-navyBorder p-6 rounded-2xl space-y-4">
                    <div class="flex items-center justify-between">
                      <h4 class="font-bold text-gray-900 dark:text-white text-lg flex items-center space-x-2">
                        <i class="fa-solid fa-folder text-shams-gold"></i>
                        <span>${escapeHtml(proj)}</span>
                      </h4>
                      <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-gray-100 dark:bg-shams-navy text-gray-500">
                        ${completed} / ${total} ${t('tasksCompleted')}
                      </span>
                    </div>

                    <!-- Progress bar -->
                    <div class="w-full bg-gray-100 dark:bg-shams-navy h-2 rounded-full overflow-hidden">
                      <div class="bg-shams-gold h-full transition-all duration-300" style="width: ${pct}%"></div>
                    </div>
                  </div>
                `;
              }).join('') : `<div class="col-span-full py-12 text-center text-gray-400">${t('noProjects')}</div>`}
            </div>
          </div>
        `;
      } else {
        // GENERIC LIST VIEW (Inbox, Next, Waiting, Someday, Done)
        let filteredTasks = state.tasks.filter(t => t.list === view);
        
        if (state.searchQuery) {
          filteredTasks = filteredTasks.filter(t => t.title.toLowerCase().includes(state.searchQuery.toLowerCase()));
        }

        main.innerHTML = `
          <div class="max-w-6xl mx-auto space-y-6 fade-in">
            <!-- SEARCH TOOLBAR -->
            <div class="bg-white dark:bg-shams-navyCard border border-gray-200 dark:border-shams-navyBorder p-4 rounded-2xl flex items-center space-x-3">
              <i class="fa-solid fa-magnifying-glass text-gray-400 ml-2"></i>
              <input type="text" value="${escapeHtml(state.searchQuery)}" oninput="handleSearch(event)" placeholder="${t('searchTasks')}" 
                class="w-full bg-transparent border-none text-sm text-gray-900 dark:text-white focus:outline-none">
            </div>

            <!-- TASK LIST CONTAINER -->
            <div class="space-y-3">
              ${filteredTasks.length > 0 
                ? filteredTasks.map(renderTaskCard).join('') 
                : `<div class="bg-white dark:bg-shams-navyCard border border-gray-200 dark:border-shams-navyBorder rounded-2xl py-12 text-center text-gray-400 text-sm">${t('empty')}</div>`}
            </div>
          </div>
        `;
      }
    }

    // --- ACTIONS & MUTATIONS ---
    function toggleTaskDone(id) {
      const task = state.tasks.find(t => t.id === id);
      if (task) {
        task.list = task.list === 'done' ? 'next' : 'done';
        saveState();
        render();
      }
    }

    function deleteTask(id) {
      state.tasks = state.tasks.filter(t => t.id !== id);
      saveState();
      render();
    }

    function addProject() {
      const input = document.getElementById('newProjectInput');
      const val = input.value.trim();
      if (val && !state.projects.includes(val)) {
        state.projects.push(val);
        input.value = '';
        saveState();
        render();
      }
    }

    function handleTaskSubmit(e) {
      e.preventDefault();
      const title = document.getElementById('taskTitleInput').value.trim();
      if (!title) return;

      const list = document.getElementById('taskListInput').value;
      const priority = document.getElementById('taskPriorityInput').value;
      const date = document.getElementById('taskDateInput').value;
      const project = document.getElementById('taskProjectInput').value.trim();

      if (project && !state.projects.includes(project)) {
        state.projects.push(project);
      }

      state.tasks.unshift({
        id: Date.now().toString(),
        title,
        list,
        priority,
        date,
        project
      });

      saveState();
      closeTaskModal();
      document.getElementById('taskForm').reset();
      render();
    }

    function handleSearch(e) {
      state.searchQuery = e.target.value;
      render();
    }

    function openTaskModal() {
      document.getElementById('taskModal').classList.remove('hidden');
    }

    function closeTaskModal() {
      document.getElementById('taskModal').classList.add('hidden');
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // --- MOBILE SIDEBAR HANDLERS ---
    const mobileBackdrop = document.getElementById('mobileBackdrop');
    const sidebar = document.getElementById('sidebar');

    function openMobileMenu() {
      sidebar.classList.remove('-translate-x-full');
      mobileBackdrop.classList.remove('hidden');
    }

    function closeMobileMenu() {
      sidebar.classList.add('-translate-x-full');
      mobileBackdrop.classList.add('hidden');
    }

    document.getElementById('openMobileSidebar').addEventListener('click', openMobileMenu);
    document.getElementById('closeMobileSidebar').addEventListener('click', closeMobileMenu);
    mobileBackdrop.addEventListener('click', closeMobileMenu);

    // --- EVENT LISTENERS ---
    document.getElementById('themeToggle').addEventListener('click', () => {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      saveState();
      applyTheme();
    });

    document.getElementById('languageSelect').addEventListener('change', (e) => {
      state.lang = e.target.value;
      saveState();
      applyLanguage();
    });

    // --- INIT ---
    window.addEventListener('DOMContentLoaded', () => {
      applyTheme();
      applyLanguage();
      updateBadges();
      switchView('home');
    });
  </script>
</body>
</html>
